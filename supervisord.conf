[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB

[program:redis]
command=/usr/bin/redis-server --daemonize no --appendonly yes --appendfsync everysec --dir /var/lib/redis --maxmemory-policy noeviction
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips *
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A app.celery_app.celery worker --loglevel=info -Q lead_processing --pool=threads --concurrency=30 --hostname=qualification@%%h
directory=/app
autostart=true
autorestart=true
priority=20
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:export-worker]
command=/bin/sh -c 'exec celery -A app.celery_app.celery worker --loglevel=info -Q "${CELERY_EXPORT_QUEUE:-lead_exports}" --pool=prefork --concurrency=1 --hostname=exports@%%h'
directory=/app
autostart=true
autorestart=true
priority=20
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:import-worker]
command=/bin/sh -c 'exec celery -A app.celery_app.celery worker --loglevel=info -Q "${CELERY_IMPORT_QUEUE:-lead_imports}" --pool=threads --concurrency=1 --hostname=imports@%%h'
directory=/app
autostart=true
autorestart=true
priority=20
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:embedding-worker]
command=/bin/sh -c 'exec celery -A app.celery_app.celery worker --loglevel=info -Q "${CELERY_EMBED_QUEUE:-lead_embeddings}" --pool=threads --concurrency=1 --hostname=embeddings@%%h'
directory=/app
autostart=true
autorestart=true
priority=20
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
