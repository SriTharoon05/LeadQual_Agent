name: Deploy to Azure App Service (Container)
 
on:
 push:
   branches: [ main ]
 workflow_dispatch:
 
env:
 AZURE_WEBAPP_NAME: uiapagents     # Set your App Service name
 REGISTRY: uiapaiagents.azurecr.io             # Set your ACR name
 IMAGE_NAME: quality-lead
 
jobs:
 build:
   runs-on: ubuntu-latest
 
   steps:
     - name: Checkout Repository
       uses: actions/checkout@v4
 
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
 
     - name: Log in to Azure Container Registry
       uses: azure/docker-login@v1
       with:
         login-server: ${{ env.REGISTRY }}
         username: ${{ secrets.AZURE_ACR_USERNAME }}
         password: ${{ secrets.AZURE_ACR_PASSWORD }}
 
     - name: Build and Push Docker Image
       run: |
         docker buildx build \
           --platform linux/amd64 \
           --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
           -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
           -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
           -f Dockerfile \
           --push \
           .
 
